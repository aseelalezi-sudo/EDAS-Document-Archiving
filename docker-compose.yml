name: edas

# Local development stack only. Every credential below is a documented development default and is
# passed through an environment variable so a deployment can override it. The API refuses to start
# with NODE_ENV=production while any of these defaults is still in place (see
# api/src/common/config/env.validation.ts).
services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_DB: edas
      POSTGRES_USER: edas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edas_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edas -d edas"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edas_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edas_minio_dev_pw}
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  minio-init:
    image: ${AWS_CLI_IMAGE:-amazon/aws-cli:latest@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-edas_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-edas_minio_dev_pw}
      AWS_DEFAULT_REGION: us-east-1
      MINIO_BUCKET: ${MINIO_BUCKET:-edas-documents}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$$MINIO_BUCKET" 2>/dev/null || aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$MINIO_BUCKET"; do sleep 2; done
        aws --endpoint-url http://minio:9000 s3api put-bucket-acl --bucket "$$MINIO_BUCKET" --acl private
        aws --endpoint-url http://minio:9000 s3api put-bucket-versioning --bucket "$$MINIO_BUCKET" --versioning-configuration Status=Enabled
        echo "MinIO bucket ready (private, versioned)"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: "4000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql://edas:${POSTGRES_PASSWORD:-edas_dev_pw}@postgres:5432/edas?schema=public
      KEYCLOAK_ISSUER: http://localhost:8080/realms/edas
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/edas/protocol/openid-connect/certs
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/edas
      KEYCLOAK_AUDIENCE: edas-api
      KEYCLOAK_CLIENT_ID: edas-web
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: "9000"
      MINIO_BUCKET: ${MINIO_BUCKET:-edas-documents}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-edas_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-edas_minio_dev_pw}
      DOWNLOAD_TICKET_SECRET: ${DOWNLOAD_TICKET_SECRET:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BODY_LIMIT: ${BODY_LIMIT:-2mb}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-600}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-edas-api}
    ports:
      - "4000:4000"
    command:
      - sh
      - -c
      - cd api && npx prisma migrate deploy && node dist/main.js
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - api
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    secrets:
      - metrics_token

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    profiles: ["observability"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager-src/alertmanager-entrypoint.sh"]
    command:
      - --storage.path=/alertmanager
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_URL_FILE: ${ALERT_WEBHOOK_URL_FILE:-}
      ALERT_WEBHOOK_SEND_RESOLVED: ${ALERT_WEBHOOK_SEND_RESOLVED:-true}
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infra/monitoring:/etc/alertmanager-src:ro
      - alertmanagerdata:/alertmanager

  loki:
    image: grafana/loki:3.5.1@sha256:a74594532eec4cc313401beedc4dd2708c43674c032084b1aeb87c14a5be1745
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki

  promtail:
    image: grafana/promtail:3.5.1@sha256:65bfae480b572854180c78f7dc567a4ad2ba548b0c410e696baa1e0fa6381299
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0@sha256:ffc818ee108d0b934fd14207fd87ff247c9b64f344ed349d0b66c166c18a2312
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - jaeger
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./infra/monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

volumes:
  pgdata:
  miniodata:
  redisdata:
  prometheusdata:
  alertmanagerdata:
  lokidata:
  grafanadata:

secrets:
  metrics_token:
    environment: METRICS_TOKEN
