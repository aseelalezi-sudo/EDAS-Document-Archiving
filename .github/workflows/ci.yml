name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit the full tree (advisory, does not block)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:secrets
      - run: npm run test:coverage
      - run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run shared:build
      - run: npm ci --prefix api
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --prefix api
      - name: Audit the full tree (advisory, does not block)
        run: npm audit --audit-level=high --prefix api
        continue-on-error: true
      - run: npm --prefix api run prisma:generate
      - run: npm run api:typecheck
      - run: npm run api:lint
      - run: npm run api:test:coverage
      - run: npm run api:build

  e2e:
    name: API end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run shared:build
      - run: npm ci --prefix api
      - run: npm --prefix api run prisma:generate
      - run: npm run api:build
      - run: pwsh -NoProfile -File scripts/e2e.ps1
      - name: API logs on failure
        if: failure()
        run: |
          echo "--- api-out ---"; tail -n 80 /tmp/edas-e2e/api-out.log 2>/dev/null || true
          echo "--- api-err ---"; tail -n 80 /tmp/edas-e2e/api-err.log 2>/dev/null || true
          docker logs edas-kc-e2e 2>&1 | tail -n 40 || true

  docker:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: edas-api:ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max

  backup:
    name: Backup and alerting scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell syntax
        run: |
          for script in scripts/backup/*.sh; do bash -n "$script"; done
          sh -n infra/monitoring/alertmanager-entrypoint.sh
      - name: Off-site backup self-test (local fake S3)
        run: bash scripts/backup/offsite.test.sh
      - name: Render and validate the Alertmanager webhook config
        run: |
          mkdir -p "$RUNNER_TEMP/am"
          ALERTMANAGER_RENDER_ONLY=1 \
            ALERTMANAGER_SRC_DIR=infra/monitoring \
            ALERTMANAGER_CONFIG_FILE="$RUNNER_TEMP/am/alertmanager.yml" \
            ALERT_WEBHOOK_URL=http://127.0.0.1:9099/hook \
            sh infra/monitoring/alertmanager-entrypoint.sh
          docker run --rm --entrypoint /bin/amtool \
            -v "$RUNNER_TEMP/am:/cfg:ro" \
            prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba \
            check-config /cfg/alertmanager.yml
      - name: Verify Alertmanager delivery to a loopback webhook
        run: node scripts/backup/alert-delivery.test.mjs "$RUNNER_TEMP/am"
      - run: npm ci --legacy-peer-deps
      - run: npm run shared:build
      - run: npm ci --prefix api
      - run: npm --prefix api run prisma:generate
      - run: npm run api:build
      - name: Restore PostgreSQL and MinIO and open the recovered document
        run: bash scripts/backup/restore-drill.sh

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
